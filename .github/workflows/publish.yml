name: Publish

on:
  push:
    branches: [ "main" ]
    tags:
      - 'v*'

jobs:
  build-and-publish-binaries:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    strategy:
      matrix:
        os: [win-x64, linux-x64, osx-x64, osx-arm64]
    steps:
    - uses: actions/checkout@v4
    
    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '10.0.x'
        
    - name: Restore dependencies
      run: dotnet restore src/VenEl.AssistantMCP.Server/VenEl.AssistantMCP.Server.csproj
      
    - name: Publish Self-Contained
      run: |
        dotnet publish src/VenEl.AssistantMCP.Server/VenEl.AssistantMCP.Server.csproj \
          -c Release \
          -r ${{ matrix.os }} \
          --self-contained true \
          -p:PublishSingleFile=true \
          -o ./publish/${{ matrix.os }}
          
    - name: Zip the output
      run: |
        cd ./publish/${{ matrix.os }}
        zip -r ../../VenEl.AssistantMCP-${{ matrix.os }}.zip ./*
        cd ../../
        
    - name: Release
      if: startsWith(github.ref, 'refs/tags/v')
      uses: softprops/action-gh-release@v2
      with:
        files: VenEl.AssistantMCP-${{ matrix.os }}.zip

  build-and-push-docker:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
    - uses: actions/checkout@v4
    
    - name: Log in to GitHub Container Registry
      uses: docker/login-action@v3
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
        
    - name: Extract metadata (tags, labels) for Docker
      id: meta
      uses: docker/metadata-action@v5
      with:
        images: ghcr.io/${{ github.repository }}
        
    - name: Build and push Docker image
      uses: docker/build-push-action@v5
      with:
        context: .
        push: true
        tags: ${{ steps.meta.outputs.tags }}
        labels: ${{ steps.meta.outputs.labels }}

  publish-nuget:
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
    - uses: actions/checkout@v4
    
    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '10.0.x'
        
    - name: Restore dependencies
      run: dotnet restore src/VenEl.AssistantMCP.Server/VenEl.AssistantMCP.Server.csproj
      
    - name: Build
      run: dotnet build src/VenEl.AssistantMCP.Server/VenEl.AssistantMCP.Server.csproj -c Release --no-restore
      
    - name: Pack NuGet Package
      run: dotnet pack src/VenEl.AssistantMCP.Server/VenEl.AssistantMCP.Server.csproj -c Release --no-build -o nupkg
      
    - name: Push to NuGet
      run: dotnet nuget push "nupkg/*.nupkg" --api-key ${{ secrets.NUGET_API_KEY }} --source https://api.nuget.org/v3/index.json --skip-duplicate
